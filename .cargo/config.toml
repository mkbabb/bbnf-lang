# Local development overrides — resolve crates from sibling repos instead of crates.io.
# This file is tracked so isolated worktrees inherit the same path-patched environment.

# Tranche AG.0: optional fast linker for debug builds.
#
# Apple's default ld64 is serial and dominates incremental link time
# on the bench binaries (~60% of the rebuild step on a two-file edit
# per profiling during AX.W0a.2.d iteration). To opt into a faster
# linker:
#
#   brew install lld       # adds /opt/homebrew/opt/lld/bin/ld64.lld
#   brew install mold      # Linux-only upstream; macOS port exists
#
# then uncomment the matching block below. Check the binary exists
# first (`ls /opt/homebrew/opt/lld/bin/ld64.lld`) — a missing linker
# fails every build with an opaque rustc error.
#
# Expected speedup on this workspace (13 GB target, release w/ fat LTO
# or dev w/ 16 codegen-units): 30–50% link time reduction, 10–20% total
# rebuild time on small edits.
#
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/lld/bin/ld64.lld"]
#
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/bin/mold"]

[patch.crates-io]
pprint = { path = "../pprint/rust" }
pprint_derive = { path = "../pprint/rust/derive" }
parse_that = { path = "../parse-that/rust/parse_that" }
bbnf-regex = { path = "../parse-that/rust/regex" }
gorgeous = { path = "crates/gorgeous" }
bbnf = { path = "crates/core" }
bbnf-ir = { path = "crates/ir" }
bbnf_derive = { path = "crates/derive" }
# Tranche AA.2: csp-solver is now a workspace member at crates/csp-solver/.
csp-solver = { path = "crates/csp-solver" }
# Tranche H: expose the local egraph substrate so bbnf-regex's HIR
# e-graph resolves against the same path-patched crate bbnf-ir uses.
egraph = { path = "crates/egraph" }
egraph-derive = { path = "crates/egraph-derive" }

# ─── AY Iteration Surface (B0.W0.a) ─────────────────────────────────────
#
# Public fast-path aliases that route routine AY work through the
# `ax-iter` profile (no DWARF, stripped debuginfo, incremental on).
# Heavy defaults (release/bench/workspace tests) are NOT shadowed here;
# those remain reachable via the existing `cargo test --workspace`,
# `cargo bench ...`, etc. surfaces.
#
# Canonical catalog: `docs/benchmarks/post-B0-W0-commands.txt`.
#
# Aliases with the `iter-` prefix default to `--profile ax-iter` and
# are the commands AY.W5-W7 executors call directly. Aliases without
# the prefix are structural surfaces (expand, asm) that AY hard gates
# cite by name.
[alias]
# Fast workspace type-check (AY.W5-W7 routine compile-gate).
iter-check = "check --profile ax-iter --workspace"

# Leaf-crate test tier under ax-iter (no derive-Parser sites; fastest
# correctness tier). Crate names match the workspace's actual package
# names: `tape`, not `bbnf-tape` — `scripts/test-tier.sh leaf` still
# passes `-p bbnf-tape` verbatim and is stale (B0.W1 owns that fix).
# This alias is the working leaf tier in the meantime.
iter-test-leaf = "test --profile ax-iter -p tape -p bbnf-ir -p egraph -p csp-solver -p bbnf-ser"

# Grammar-tier passthrough: generic `test --profile ax-iter`, intended
# to be paired with `--test <name>` or `-p <crate>` at call sites —
# e.g. `cargo iter-test-grammar -p bbnf --test value_api_apples_to_apples`.
# The Makefile `iter-test-grammar` target routes through
# `scripts/test-tier.sh grammar --profile ax-iter` for the full
# per-grammar sweep.
iter-test-grammar = "test --profile ax-iter"

# `cargo expand` entrypoints for AY.W5-W7 hard gates 1-3 (W5, W6, W7).
# Each expands a bench target; callers redirect into a file.
expand-json = "expand -p bbnf --bench json_monolithic"
expand-css = "expand -p bbnf --bench css_l4"
expand-bbnf = "expand -p bbnf --bench bbnf_monolithic"
expand-sheets = "expand -p bbnf --bench google_sheets_monolithic"

# `cargo asm` entrypoint for AY.W5 hard gate 3 (close-stamp
# verification). Callers append `--bench <name> <fn>`, e.g.
# `cargo asm-parse --bench json_monolithic json::close_compound`.
asm-parse = "asm -p bbnf --profile release"
