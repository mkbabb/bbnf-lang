name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build darwin-arm64
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Require native Apple arm64 host
        run: test "$(uname -m)" = arm64

      - name: Install repository rust toolchain
        run: |
          toolchain="$(awk -F '"' '/^channel =/ { print $2 }' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add --toolchain "$toolchain" aarch64-apple-darwin
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Build LSP binary
        run: cargo build --release --target aarch64-apple-darwin -p bbnf-lsp --bin bbnf-lsp

      - name: Copy binary to server/
        run: |
          mkdir -p server
          cp target/aarch64-apple-darwin/release/bbnf-lsp server/bbnf-lsp

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install extension deps
        working-directory: extension
        run: npm ci

      - name: Package VSIX
        working-directory: extension
        run: npx vsce package --target darwin-arm64 -o ../bbnf-lang-darwin-arm64.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-darwin-arm64
          path: bbnf-lang-darwin-arm64.vsix

  publish:
    name: Publish to Marketplace
    needs: build
    runs-on: macos-14
    steps:
      - name: Require native Apple arm64 host
        run: test "$(uname -m)" = arm64

      - uses: actions/download-artifact@v4
        with:
          name: vsix-darwin-arm64

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @vscode/vsce

      - name: Publish
        run: vsce publish --packagePath bbnf-lang-darwin-arm64.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
