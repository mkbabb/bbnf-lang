[package]
name = "bbnf-ir"
version = "0.1.6"
edition = "2024"
license = "MIT"
description = "Canonical Grammar IR for the BBNF compiler pipeline"
repository = "https://github.com/mkbabb/bbnf-lang"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rmp-serde = "1"
parse_that = "0.4"
bbnf-regex = { version = "0.1", features = ["serde"] }
rustc-hash = "2"
rayon = "1"
smallvec = "1.13"
csp-solver = "0.1"
egraph = { path = "../egraph" }
egraph-derive = { path = "../egraph-derive" }
# RON serialisation for per-grammar rewrite-rule files
# (`grammar/<g>/rewrites/*.ron`); consumed by `crate::rewrites::schema`
# and `crate::rewrites::RuleSet::{load_from_ron, save_to_ron}`.
ron = "0.12"

# Dev-only deps for the permanent substrate-audit test
# (`crates/ir/tests/substrate_audit.rs`, AZ-IV.W5.4 / Hard Gate 13).
# `cargo_metadata` resolves workspace member paths once and feeds the
# AST-walk; `syn` parses every production .rs file under the audited
# crates to enumerate `pub` substrates + count callers.
[dev-dependencies]
cargo_metadata = "0.18"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
rustc-hash = "2"
