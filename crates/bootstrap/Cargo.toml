[package]
name = "bbnf-bootstrap"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bootstrap: generates self-hosted BBNF grammar parser via cargo expand"

[dependencies]
# B2.W0.c: `bbnf_derive` dep retired; this crate is now a thin
# re-export of `bbnf::grammar::generated::BbnfBootstrap`. The IR
# pipeline runs in `cargo xtask regen`, not in a proc-macro this
# crate consumed.
bbnf = { path = "../core" }
# `bbnf-ir` carries the diagnostic surface (`GrammarIR`, `IrNode`,
# `lift_dta`, etc.) that the in-tree dev-only binaries
# (`src/bin/dump_ir.rs`, `src/bin/cost_grid_sweep.rs`) drive. The
# library crate (`src/lib.rs`) does not consume `bbnf-ir`; the dep
# only resolves the bin imports. Restoring this entry closes the
# pre-B2 build-orphan flagged at B3.FINAL §"Out of scope" and
# B4.B2 §"Pre-existing build-orphan".
bbnf-ir = { path = "../ir" }
