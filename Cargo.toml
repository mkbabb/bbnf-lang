[workspace]
members = ["crates/core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/mkbabb/bbnf-lang"

[workspace.dependencies]
bbnf-regex = { version = "=0.1.0", path = "../parse-that-skv26/rust/regex", default-features = false, features = [] }
blake3 = { version = "1.8", default-features = false, features = ["std"] }
parse_that = { version = "=0.5.0", path = "../parse-that-skv26/rust/parse_that", default-features = false, features = [] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
