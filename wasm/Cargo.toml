[package]
name = "bbnf-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "WASM bindings for BBNF analysis + gorgeous formatting"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bbnf-analysis = { version = "0.1.0", path = "../rust/bbnf-analysis" }
bbnf = { version = "0.2.0", path = "../rust/bbnf" }
bbnf-ir = { version = "0.1.0", path = "../rust/bbnf-ir" }
gorgeous = { version = "0.1", features = ["vm"] }
pprint = "0.3"
parse_that = "0.3"
ls-types = "0.0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true

