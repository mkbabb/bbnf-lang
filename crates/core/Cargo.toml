[package]
name = "bbnf"
version = "0.2.11"
edition = "2024"
license = "MIT"
description = "BBNF grammar parser and code generator built on parse_that"
repository = "https://github.com/mkbabb/bbnf-lang"

[lib]
name = "bbnf"
path = "src/lib.rs"

[dependencies]
pprint = "0.3"
parse_that = "0.4"
bbnf-ir = { version = "0.1", path = "../ir" }
bbnf-ser = { version = "0.1", path = "../ser" }
tape = { version = "0.1", path = "../tape" }
simd-scan = { version = "0.1", path = "../simd-scan" }
egraph = { path = "../egraph" }
csp-solver = "0.1"
rustc-hash = "2"

syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
indexmap = "2"
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]
# iai-callgrind CI surface. Linux-only (requires valgrind). The `iai` feature
# gates the json_callgrind bench's compile; iai-callgrind itself is a
# Linux-target-only dev-dep (see [target.'cfg(target_os = "linux")'.dev-deps]
# further down in this file). `.github/workflows/bench-iai.yml` invokes
# `cargo bench --bench json_callgrind --features iai` on Linux CI only.
iai = []

[dev-dependencies]
quote = "1"
regex = "1"
tempfile = "3"
prettyplease = "0.2"
bbnf_derive = { version = "0.2", path = "../derive" }
json-prototype = { path = "../json-prototype" }
pprint = "0.3"
parse_that = "0.4"
divan = "0.1"
mimalloc = "0.1"
sonic-rs = "0.5"

# JSON competitor parsers
serde_json = "1"
serde = { version = "1", features = ["derive"] }
simd-json = "0.14"
jiter = "0.8"
serde_json_borrow = "0.9"
nom = "7"
winnow = "0.7"
pest = "2.5"
pest_grammars = "2.5"

# Tree-sitter
tree-sitter = "0.25"
tree-sitter-json = "0.24"

# CSS competitor parsers
cssparser = "0.34"
lightningcss = "1.0.0-alpha.71"

# WASM runtime for benchmarks
wasmtime = "29"

# Number parsing for borrow/owned tiers
fast-float2 = "0.2"


[[bench]]
name = "json_monolithic"
path = "benches/json/monolithic.rs"
harness = false

[[bench]]
name = "json_parse_that"
path = "benches/json/parse_that.rs"
harness = false

[[bench]]
name = "json_vm"
path = "benches/json/vm.rs"
harness = false

[[bench]]
name = "json_competitors"
path = "benches/json/competitors.rs"
harness = false

[[bench]]
name = "json_stress"
path = "benches/json/stress.rs"
harness = false

[[bench]]
name = "css_l4"
path = "benches/css/l4.rs"
harness = false

[[bench]]
name = "css_vm"
path = "benches/css/vm.rs"
harness = false

[[bench]]
name = "css_competitors"
path = "benches/css/competitors.rs"
harness = false

[[bench]]
name = "css_stress"
path = "benches/css/stress.rs"
harness = false

[[bench]]
name = "google_sheets_monolithic"
path = "benches/google_sheets/monolithic.rs"
harness = false

[[bench]]
name = "google_sheets_vm"
path = "benches/google_sheets/vm.rs"
harness = false

[[bench]]
name = "json_ts"
path = "benches/json/ts.rs"
harness = false

[[bench]]
name = "json_wasm"
path = "benches/json/wasm.rs"
harness = false

[[bench]]
name = "css_ts"
path = "benches/css/ts.rs"
harness = false

[[bench]]
name = "css_wasm"
path = "benches/css/wasm.rs"
harness = false

[[bench]]
name = "compile_pipeline"
path = "benches/compile_pipeline.rs"
harness = false

[[bench]]
name = "json_callgrind"
path = "benches/json_callgrind.rs"
harness = false
required-features = ["iai"]

[[bench]]
name = "json_monolithic_value"
path = "benches/json/value.rs"
harness = false

[[bench]]
name = "bbnf_monolithic"
path = "benches/bbnf/monolithic.rs"
harness = false

[[bench]]
name = "twitter_lazy_field"
path = "benches/twitter_lazy_field.rs"
harness = false


# iai-callgrind is a Linux-only dev-dep (requires valgrind linkage).
# macOS dev-hosts skip it; the `iai` feature + `required-features` on the
# json_callgrind bench make the bench a no-op when the feature is off.
# CI (Linux) activates the feature explicitly via the workflow yml.
[target.'cfg(target_os = "linux")'.dev-dependencies]
iai-callgrind = "0.12"
