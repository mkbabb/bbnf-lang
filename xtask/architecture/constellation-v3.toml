[[exclusions]]
id = "git-state"
repository = "bbnf"
pattern = ".git/**"
reason = "git administrative state is represented by the worktree plane"

[[exclusions]]
id = "node-modules"
repository = "bbnf"
pattern = "node_modules/**"
reason = "installed dependency tree is bound by lock and tool state"

[[exclusions]]
id = "cargo-target"
repository = "bbnf"
pattern = "**/target/**"
reason = "ephemeral Cargo build output"

[[exclusions]]
id = "nested-node-modules"
repository = "bbnf"
pattern = "**/node_modules/**"
reason = "installed dependency tree is bound by lock and tool state"

[[exclusions]]
id = "claude-worktrees"
repository = "bbnf"
pattern = ".claude/worktrees/**"
reason = "external worktree contents are represented by the worktree plane"

[[exclusions]]
id = "test-results"
repository = "bbnf"
pattern = "**/test-results/**"
reason = "ephemeral browser test output"

[[exclusions]]
id = "profile-target"
repository = "bbnf"
pattern = ".profile-target/**"
reason = "ephemeral profiling build output"

[[exclusions]]
id = "playwright-state"
repository = "bbnf"
pattern = ".playwright-mcp/**"
reason = "ephemeral browser control state"

[[exclusions]]
id = "test-dist"
repository = "bbnf"
pattern = "**/.test-dist/**"
reason = "ephemeral test build output"

[[exclusions]]
id = "parse-git-state"
repository = "parse-that"
pattern = ".git/**"
reason = "git administrative state is represented by the worktree plane"

[[exclusions]]
