[workspace]
resolver = "2"
members = [
  "crates/bbnf",
  "crates/grammar",
  "crates/ir",
  "crates/passes",
  "crates/codegen",
  "crates/runtime",
  "crates/parse-that-regex",
  "crates/bbnf-regex",
  "crates/bbnf-simd",
  "crates/bbnf-bench",
  "crates/test-fixtures",
  "xtask",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkbabb/bbnf-lang"
rust-version = "1.78"

[workspace.dependencies]
bbnf = { path = "crates/bbnf" }
grammar = { path = "crates/grammar" }
ir = { path = "crates/ir" }
passes = { path = "crates/passes" }
codegen = { path = "crates/codegen" }
runtime = { path = "crates/runtime" }
parse-that-regex = { path = "crates/parse-that-regex" }
bbnf-regex = { path = "crates/bbnf-regex" }
bbnf-simd = { path = "crates/bbnf-simd" }
bbnf-bench = { path = "crates/bbnf-bench" }
test-fixtures = { path = "crates/test-fixtures" }
egraph = { path = "../crates/egraph" }

anyhow = "1"
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
cssparser = "0.34"
memchr = "2"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "1"
toml = "0.8"

[workspace.metadata.bbnf]
generated_root = "crates/runtime/src/grammars"
fixture_root = "crates/test-fixtures/corpus"
profile = "balanced"
host_registry = "skinny-none"

[workspace.metadata.bbnf.grammars.json]
source = "grammars/json.bbnf"
output_dir = "crates/runtime/src/grammars/json"

[workspace.metadata.bbnf.grammars.json.codegen]
rust = true
wasm = false
generated_loc_budget = 4000

[workspace.metadata.bbnf.grammars.json.runtime]
tape_mode = "lazy"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 16

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
strip = false
split-debuginfo = "packed"

[profile.bench]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
strip = false
split-debuginfo = "packed"

[profile.ax-iter]
inherits = "release"
lto = "thin"
codegen-units = 16
