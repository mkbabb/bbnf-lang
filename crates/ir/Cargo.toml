[package]
name = "bbnf-ir"
version = "0.1.7"
edition = "2024"
license = "MIT"
description = "Canonical Grammar IR for the BBNF compiler pipeline"
repository = "https://github.com/mkbabb/bbnf-lang"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rmp-serde = "1"
parse_that.workspace = true
parse-that-regex = { workspace = true, features = ["serde"] }
rustc-hash = "2"
rayon = "1"
smallvec = "1.13"
csp-solver.workspace = true
parse-that-egraph.workspace = true
parse-that-egraph-derive.workspace = true
# RON serialisation for per-grammar rewrite-rule files
# (`grammar/<g>/rewrites/*.ron`); consumed by `crate::rewrites::schema`
# and `crate::rewrites::RuleSet::{load_from_ron, save_to_ron}`.
ron = "0.12"

# SK-V19.W6a, sk-v27 LW2.TOPO-4b — `build.rs` reads this crate's own
# `[package.metadata.bbnf-strategy]` (below) and emits
# `PRODUCTION_MANIFEST_TABLE` into `$OUT_DIR`. The grammar-named rows are
# manifest data, not a const in this generic crate (Lock 14), and they ship
# inside the package, so the crate builds from its crates.io tarball.
[build-dependencies]
toml = "0.8"

# Dev-only deps for the permanent substrate-audit test
# (`crates/ir/tests/substrate_audit.rs`, AZ-IV.W5.4 / Hard Gate 13).
# `cargo_metadata` resolves workspace member paths once and feeds the
# AST-walk; `syn` parses every production .rs file under the audited
# crates to enumerate `pub` substrates + count callers.
[dev-dependencies]
cargo_metadata = "0.18"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
rustc-hash = "2"

# Manifest-driven `EmitStrategy::for_grammar` binding table (AZ-IV.W1.8,
# Fermat hardening pass §F5, AZ-IV §Hard Gates 18 + 22). Each row carries
# every parser-struct ident the grammar advertises plus the Rust-backend
# `StructBuilder` / `Document` paths the emitter splices into the generated
# `parse()` body. `build.rs` turns it into `PRODUCTION_MANIFEST_TABLE`
# (`src/registry/strategy.rs`); adding a grammar adds a row here and no
# source arm. The synthetic-grammar test in
# `crates/core/tests/synthetic_grammar_strategy.rs` proves the resolver
# consults the table without source-arm edits.
[package.metadata.bbnf-strategy]
grammars = [
    { idents = ["JsonParser", "JsonGrammar"], rust_builder_path = "crate::runtime::json::JsonStructBuilder", rust_document_path = "crate::runtime::json::JsonDocument" },
    { idents = ["GoogleSheetsParser", "GoogleSheetsGrammar"], rust_builder_path = "crate::runtime::google_sheets::SheetsStructBuilder", rust_document_path = "crate::runtime::google_sheets::SheetsDocument" },
    { idents = ["CssL4Parser"], rust_builder_path = "crate::runtime::css_l4::CssStructBuilder", rust_document_path = "crate::runtime::css_l4::CssDocument" },
    { idents = ["BbnfBootstrap", "BbnfParser"], rust_builder_path = "crate::runtime::bbnf::BbnfStructBuilder", rust_document_path = "crate::runtime::bbnf::BbnfDocument" },
    { idents = ["CsvParser", "CsvGrammar"], rust_builder_path = "crate::runtime::csv::CsvStructBuilder", rust_document_path = "crate::runtime::csv::CsvDocument" },
    { idents = ["MathParser", "MathGrammar"], rust_builder_path = "crate::runtime::math::MathStructBuilder", rust_document_path = "crate::runtime::math::MathDocument" },
    { idents = ["BnfParser", "BnfGrammar"], rust_builder_path = "crate::runtime::bnf::BnfStructBuilder", rust_document_path = "crate::runtime::bnf::BnfDocument" },
    { idents = ["EbnfParser", "EbnfGrammar"], rust_builder_path = "crate::runtime::ebnf::EbnfStructBuilder", rust_document_path = "crate::runtime::ebnf::EbnfDocument" },
    { idents = ["CssPrettyParser", "CssPrettyGrammar"], rust_builder_path = "crate::runtime::css_pretty::CssPrettyStructBuilder", rust_document_path = "crate::runtime::css_pretty::CssPrettyDocument" },
]
