[package]
name = "simd-scan"
version = "0.1.0"
edition = "2024"
description = "Structural-bitmap kernels for the bbnf-lang DTA driver on Apple AArch64 NEON and wasm32 SIMD, with a scalar correctness reference."

[lib]
crate-type = ["lib"]

[dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"

[dev-dependencies]
proptest = "1"
divan = "0.1"
libc = "0.2"

[[bench]]
name = "stage1_throughput"
harness = false
