[package]
name = "bbnf-lsp"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mkbabb/bbnf-lang"
description = "Language server for BBNF grammar files"

[lib]
name = "bbnf_lsp"
path = "src/lib.rs"

[[bin]]
name = "bbnf-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bbnf = { version = "0.3.0", path = "../core" }
bbnf-ir = { version = "0.2.0", path = "../ir" }
bbnf-analysis = { version = "0.2.0", path = "../analysis" }

[dev-dependencies]
tempfile = "3"
divan = "0.1"

[[bench]]
name = "bench_lsp"
path = "benches/bench_lsp.rs"
harness = false

