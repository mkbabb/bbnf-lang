[workspace]
members = ["crates/core"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/mkbabb/bbnf-lang"

[workspace.dependencies]
bbnf-regex = { path = "../parse-that-skv26/rust/regex" }
blake3 = "1.8"
parse_that = { path = "../parse-that-skv26/rust/parse_that" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
