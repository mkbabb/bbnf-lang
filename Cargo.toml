[workspace]
members = ["crates/core", "crates/analysis", "crates/ir", "crates/lsp", "crates/ser", "crates/gorgeous", "crates/bootstrap", "crates/bbnf-path", "crates/bbnf-path-ts", "crates/corpus", "crates/oracle", "xtask"]
exclude = ["wasm"]
resolver = "2"

# B2: workspace grammar manifest. `cargo xtask regen` reads this table
# to know which grammars to regenerate. Each entry produces a
# corresponding `crates/core/src/grammar/generated/<ident>.rs` file.
#
# Entries enumerated from the union of every `#[parser(path = "...")]`
# site across the workspace (rg over crates/). Sites pointing at the
# SAME grammar file collapse to one manifest entry; the manifest carries
# the grammar's *capabilities* (prettify, serialize, structural,
# skip_recover) as features so consumer-side derive attrs can reduce
# to `include!` + marker struct (W1 scope).
#
# `path` is workspace-relative. `cargo xtask regen` also writes each
# grammar's source to `crates/core/<path>`, the in-crate copy the generated
# parser `include_str!`s, so `bbnf` builds from its published package;
# `cargo xtask regen --check` fails on a missing or drifted copy (sk-v27
# LW2.TOPO-4b). `grammar/` stays the one source.
# ── Edges into the sibling repositories (sk-v27 LW2.TOPO-1, ruling X-5) ──────
# The repository graph is pprint -> parse-that -> bbnf-lang
# (scripts/check-repo-dag.sh). Each edge is a git + rev pin on a pushed
# commit (no [patch] table, no sibling path) and carries the version it takes
# on crates.io, so the publish cascade edits only these sources. Members take
# them with `<name>.workspace = true`; moving a pin is one commit that edits
# a rev here and the lockfile.
[workspace.dependencies]
parse_that               = { version = "0.4", git = "https://github.com/mkbabb/parse-that", rev = "661edc686be4e319e2e71f887d15264fd71642e7" }
parse-that-regex         = { version = "0.1.0", git = "https://github.com/mkbabb/parse-that", rev = "661edc686be4e319e2e71f887d15264fd71642e7" }
parse-that-egraph        = { version = "0.1.0", git = "https://github.com/mkbabb/parse-that", rev = "661edc686be4e319e2e71f887d15264fd71642e7" }
parse-that-egraph-derive = { version = "0.1.0", git = "https://github.com/mkbabb/parse-that", rev = "661edc686be4e319e2e71f887d15264fd71642e7" }
pprint                   = { version = "0.4", git = "https://github.com/mkbabb/pprint", rev = "32d73ca44921b07eda29ec0d5c0decc430687dd5" }
# csp-solver has one home, mkbabb/csp-solver; 0.4.0 is the release whose
# src/ and data/ are byte-identical to the copy crates/csp-solver vendored.
csp-solver               = "0.4.0"

[workspace.metadata.bbnf]
grammars = [
    { ident = "bbnf",          path = "grammar/bbnf/bbnf.bbnf",                   features = ["structural", "prettify", "serialize"] },
    { ident = "json",          path = "grammar/json/json.bbnf",                   features = ["prettify", "serialize"] },
    { ident = "css_l4",        path = "grammar/css/l4/stylesheet.bbnf",           features = ["skip_recover", "prettify", "serialize"] },
    { ident = "css_pretty",    path = "grammar/css/pretty.bbnf",                  features = ["skip_recover", "prettify", "serialize"] },
    { ident = "google_sheets", path = "grammar/google-sheets/google-sheets.bbnf", features = ["skip_recover", "prettify", "serialize"] },
    { ident = "ebnf",          path = "grammar/ebnf/ebnf.bbnf",                   features = ["prettify", "serialize"] },
    { ident = "bnf",           path = "grammar/bnf/bnf.bbnf",                     features = ["prettify", "serialize"] },
    { ident = "csv",           path = "grammar/misc/csv.bbnf",                    features = ["serialize"] },
    { ident = "math",          path = "grammar/misc/math.bbnf",                   features = ["serialize"] },
]

# ─── Profile tiers (B0.W1.a) ────────────────────────────────────────────
#
# Three intentional tiers cover routine iteration, profiling preparation,
# and final-proof numerics. Do not cross-wire them — each tier has a
# distinct cost model and a distinct consumer.
#
#   Routine        → `ax-iter`        compile-gate / non-samply tests;
#                                     inherits dev, strips DWARF, fast link.
#   Profiling-prep → `profiling-prep` build bench/test binaries once for
#                                     repeatable samply capture; inherits
#                                     release + re-asserts DWARF invariants
#                                     that samply symbol resolution needs
#                                     (see docs/instructions/PROFILING.md
#                                     §Samply invocation rules).
#   Final-proof    → `bench`          fat LTO publish-grade numerics;
#                                     AY.W5-W7 close gates run here.
#
# `release` remains the baseline for non-bench binaries; the three tiers
# above are what AY iteration, profiling, and final-proof actually hit.
#
# ────────────────────────────────────────────────────────────────────────

[profile.release]
lto = "thin"
codegen-units = 1
debug = true
strip = false
split-debuginfo = "packed"

[profile.bench]
# AW-IV.W2.2 — belt-and-suspenders verification cover for W2.1's
# inline-emit migration. The hot-path strategy is source-level flat
# emission (helper bodies spliced into walker arms at codegen); LTO +
# codegen-units=1 catch any helper that slipped through and remained as
# a cross-crate call boundary, collapsing it at link time so `nm` shows
# zero hot-path helper symbols in the bench binary. `debug = true`
# preserved for samply symbol resolution (see feedback_samply_symbols).
lto = "fat"
codegen-units = 1
debug = true

# B0.W1.a — profiling-prep profile. Build bench/test binaries once,
# samply them many times, match final-proof numerics. Intent: reusable
# prepared binaries for AY.W5-W7 samply gates without paying the fat-LTO
# cost of `[profile.bench]` on every capture.
#
# Inherits `release` (thin LTO, codegen-units=1). The three keys below
# are load-bearing and re-stated explicitly even though `release` already
# sets them — profile provenance is part of the discipline, and samply
# symbol resolution depends on every one:
#   debug = true             → DWARF emitted so samply resolves frames
#                              (feedback_samply_symbols: samply needs
#                              debug=true to name hot-path symbols).
#   strip = false            → DWARF survives the link step; otherwise
#                              samply falls back to address-only frames.
#   split-debuginfo = "packed" → DWARF travels in a sibling artefact
#                              alongside the binary so profile-headless
#                              symbol load finds it from the bench binary
#                              path alone.
[profile.profiling-prep]
inherits = "release"
debug = true
strip = false
split-debuginfo = "packed"

[profile.dev]
incremental = true
codegen-units = 16

[profile.dev.package.bbnf-ir]
opt-level = 1

[profile.dev.package.csp-solver]
opt-level = 1

[profile.dev.package.parse_that]
opt-level = 1

# `[profile.ax-iter]` lives in `.cargo/config.toml` as the workspace's
# single source of truth (debug = "line-tables-only", codegen-units = 256,
# incremental = true, opt-level = 0). AZ-III.W0p.2 consolidated the two
# definitions; do not re-add an `[profile.ax-iter]` block here.
