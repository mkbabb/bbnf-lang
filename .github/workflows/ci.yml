name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    name: Rust — preflight + workspace close
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-expand
        run: cargo install cargo-expand --locked

      # ── Preflight (routine surface) ────────────────────────────────
      # Fast checks that close on the ax-iter profile. Bootstrap regen
      # clean, clippy, and compile-gate under the routine profile.
      # Short timeout — this block is the iteration loop, not the
      # close gate.
      - name: Preflight — bootstrap regen clean
        timeout-minutes: 5
        run: bash scripts/check-bootstrap-clean.sh
      - name: Preflight — clippy
        timeout-minutes: 10
        run: cargo clippy --all-targets -- -D warnings
      - name: Preflight — iter-check (ax-iter compile-gate)
        timeout-minutes: 5
        run: cargo iter-check

      # ── Heavy (wave-close gates) ───────────────────────────────────
      # Full-workspace correctness + parity proofs. These are the
      # close gates; they pay the full release-profile cost and are
      # explicitly separated from the routine preflight block above.
      - name: Heavy — workspace tests
        run: cargo test --workspace
      - name: Heavy — sonic-rs JSON parity
        run: cargo test -p bbnf --test sonic_rs_parity --release
      - name: Heavy — lightningcss CSS parity
        run: cargo test -p bbnf --test lightningcss_parity --release

  extension:
    name: Extension — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
