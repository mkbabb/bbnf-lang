[package]
name = "tape"
version = "0.1.0"
edition = "2024"
description = "Tape representation for bbnf-lang parser output. The eager AST replacement: a columnar (Struct-of-Arrays) record substrate the parser writes and the generated view types read lazily via accessor methods."

[features]
default = ["rayon"]
# AW.1.7 — decision log + resumable snapshot for the DTA driver. Off by
# default; enabling adds the `Option<&mut Vec<u8>>` parameter to
# `dta_run` so LLVM has no branch to hoist on the hot path when the
# feature is disabled (R01 §5 signature variance).
dta-replay = []

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
rayon = { version = "1", optional = true }
# AZ-II.cutover.A — `tape::dta` is now a re-export over `bbnf_ir::dta`
# (the four DTA live-substrate types hoisted to the IR per
# `audit/AUDIT-6-ARCHITECTURE.md` §8.2). Tape gains a regular dep on
# `bbnf-ir` here; the dep retires alongside the crate at cutover.C.
bbnf-ir = { path = "../ir" }

[dev-dependencies]

[lib]
crate-type = ["lib"]

# AW-IV.W5.1 — reduce_column scalar-vs-SIMD bench on canada.json-sized
# f64 column. Hard gate: ≥ 6× SIMD speedup over scalar left-fold OR
# per-arch rationale.
[[bench]]
name = "reduce_column"
harness = false
