[package]
name = "bbnf"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic BBNF source-to-direct-Rust compiler"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "bbnf"
path = "src/lib.rs"

[[bin]]
name = "bbnf-gen"
path = "src/bin/bbnf-gen.rs"

[[test]]
name = "frontend_contract"
path = "tests/frontend_contract.rs"

[[test]]
name = "dependency_scc_laws"
path = "tests/dependency_scc_laws.rs"

[[test]]
name = "type_analysis_laws"
path = "tests/type_analysis_laws.rs"

[[test]]
name = "emitter_contract"
path = "tests/emitter_contract.rs"

[[test]]
name = "replay_edit_laws"
path = "tests/replay_edit_laws.rs"

[[test]]
name = "record_semantic_laws"
path = "tests/record_semantic_laws.rs"

[[test]]
name = "carrier_lookup_laws"
path = "tests/carrier_lookup_laws.rs"

[[test]]
name = "identity_opacity"
path = "tests/identity_opacity.rs"

[[test]]
name = "w3_instance_frontend_contract"
path = "tests/w3_instance_frontend_contract.rs"

[[test]]
name = "w3_semantic_pratt_contract"
path = "tests/w3_semantic_pratt_contract.rs"

[[test]]
name = "w3_replay_public_contract"
path = "tests/w3_replay_public_contract.rs"

[dependencies]
bbnf-regex.workspace = true
blake3.workspace = true
parse_that.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jsonschema = { version = "0.49.2", default-features = false }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
toml = "1.1.4"
trybuild = "1"
