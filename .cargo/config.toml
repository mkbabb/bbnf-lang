# ─────────────────────────────────────────────────────────────────────────────
# .cargo/config.toml — bbnf-lang workspace
#
# Authored in Tranche B1.W0 as the successor to the 32-line patch-only file.
# Covers:
#   - path patches (existing crate resolutions; preserved verbatim)
#   - compile profiles (ax-iter / ay-final)
#   - alias surface (iteration + test + bench)
#   - build flags (-Zthreads, -Zshare-generics; nightly-gated)
#   - one native target: Apple arm64
#
# Design invariants:
#   * Every iteration alias carries `--profile ax-iter` explicitly
#     (feedback: iter-profile-always).
#   * No fallback/shim profiles.
#   * Bench aliases invoke a single `cargo bench` pass; they do NOT
#     issue N serial `-p X --bench Y` commands (feedback: bench-single-run,
#     bench-sequential-regression — divan runs its own serial regression
#     pass inside one harness invocation).
#   * Parallel `cargo check -p A + cargo check -p B` silently serialises
#     on target-lock (feedback: single-cargo-per-target). The `iter-check-*`
#     aliases are single-invocation; fleet orchestration must honour the
#     rule by using one `--workspace` alias, not two parallel per-package
#     invocations.
# ─────────────────────────────────────────────────────────────────────────────

# ── Build wrapper (sccache) ──────────────────────────────────────────────────
# AZ-I.W2-act.W0 hygiene cut H1: sccache is the workspace-wide rustc wrapper.
# Hardlinked cache at ~/.cache/sccache (sccache default) is shared across
# worktrees — cold compile reclaim ≈ 3-5 min per fan-out worktree under the
# parallel-agent dispatch model.
#
# Required: `brew install sccache` (macOS) / `cargo install sccache` (any
# host). The workspace mandates the wrapper — there is no fallback path
# (feedback: no-workarounds). If sccache is missing on a dev host, install
# it before any cargo invocation. Cache directory autodetection picks up
# `$XDG_CACHE_HOME/sccache` or `~/.cache/sccache` without further config.

[build]
rustc-wrapper = "sccache"
target = "aarch64-apple-darwin"

[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

# ── Path patches ─────────────────────────────────────────────────────────────
# Sibling-repo path resolution for bbnf-lang. Mirror these in any repo that
# depends on path-patched members (parse-that, pprint).

[patch.crates-io]
pprint          = { path = "../pprint/rust" }
pprint_derive   = { path = "../pprint/rust/derive" }
parse_that      = { path = "../parse-that/rust/parse_that" }
bbnf-regex      = { path = "../parse-that/rust/regex" }
gorgeous        = { path = "crates/gorgeous" }
bbnf            = { path = "crates/core" }
bbnf-ir         = { path = "crates/ir" }
bbnf-ser        = { path = "crates/ser" }
csp-solver      = { path = "crates/csp-solver" }
egraph          = { path = "crates/egraph" }
egraph-derive   = { path = "crates/egraph-derive" }

# ── Profiles ────────────────────────────────────────────────────────────────

# ax-iter: dev-loop iteration profile. Inherits dev; favours compile speed.
# Used by every `iter-*` alias below; must never appear on a bench target.
[profile.ax-iter]
inherits        = "dev"
opt-level       = 0
debug           = "line-tables-only"  # enough for samply backtraces; minimal debuginfo cost
incremental     = true
codegen-units   = 256                 # maximise parallel codegen on dev hosts

# ay-final: release profile tuned for correctness benchmarks and publishable
# binaries (playground WASM, LSP release). Fat LTO + single codegen unit.
[profile.ay-final]
inherits        = "release"
lto             = "fat"
codegen-units   = 1
debug           = 1                   # keep samply-resolvable symbols
strip           = false
split-debuginfo = "packed"

# bench-iter: dev-loop bench profile. Inherits bench (release-level optimisation
# semantics) but disables LTO, expands codegen-units, enables incremental, and
# trims debuginfo to line tables. Purpose: rebuild the 5-harness AZ-III sweep
# in seconds during iteration rather than the >50-min fat-LTO wall under
# `[profile.ay-final]` / `[profile.bench]`. Used exclusively by the
# `bench-iter-*` aliases below; final-grade numerics still flow through
# `bench-*` (ay-final) and `final-bench` (release+fat-LTO).
[profile.bench-iter]
inherits        = "bench"
lto             = "off"
codegen-units   = 16
incremental     = true
debug           = "line-tables-only"

# ── Aliases ─────────────────────────────────────────────────────────────────
# Routine surfaces. Every alias is the single canonical way to issue its
# operation; the Makefile delegates here rather than duplicating flags.
#
# Cost model (B1.W0 invariant 10):
#   * routine (iter-check)          — workspace minus the four proc-macro-heavy
#                                     crates (gorgeous, bbnf-bootstrap,
#                                     bbnf-analysis, bbnf-lsp). Seconds-scale;
#                                     the default dev-loop surface.
#   * per-exclude fast-paths        — one named alias per excluded crate so the
#                                     routine-surface excludes each remain
#                                     validatable on demand:
#                                       iter-check-lsp       (bbnf-analysis + bbnf-lsp)
#                                       iter-check-prettify  (gorgeous)
#                                       iter-check-bootstrap (bbnf-bootstrap)
#   * close-gate (iter-check-full)  — the heavy surface; full workspace compile
#                                     under ax-iter. Reserved for close-ceremony
#                                     and pre-dispatch proof; never iteration.
#   * bench surface                 — divan-backed cold-per-parse benches:
#                                       bench-json / bench-css / bench-bbnf /
#                                       bench-sheets / bench-compile / bench-all
#                                       on the native Apple arm64 plane.

[alias]
# Workspace tools. Keeps `cargo xtask <subcommand>` as the canonical
# checked-in entrypoint rather than depending on a host-local cargo-xtask
# binary.
#
# AZ-I.W2-act.W0 hygiene cut H3: default `xtask` alias compiles xtask under
# `--profile ax-iter`, not `--release`. Cold-compile reclaim ≈ 30-60 s per
# emitter change under the regen-iterate-test loop. CI invocations that
# need release-grade xtask binaries pass `--release` explicitly via
# `cargo run -p xtask --release -- <subcommand>`; no separate alias —
# routine iteration is the canonical surface.
xtask                 = "run -p xtask --profile ax-iter --"

# Iteration: cargo check surfaces (ax-iter profile). Each covers one bounded
# working-set; fleet orchestrators use `iter-check-full` when they need the
# whole workspace in one pass.
#
# Invariant 10: every `--exclude`d crate below has a named fast-path alias
# (iter-check-lsp / iter-check-prettify / iter-check-bootstrap).
iter-check            = "check --profile ax-iter --workspace --exclude bbnf-bootstrap --exclude gorgeous --exclude bbnf-analysis --exclude bbnf-lsp"
iter-check-lsp        = "check --profile ax-iter -p bbnf-analysis -p bbnf-lsp"
iter-check-prettify   = "check --profile ax-iter -p gorgeous"
iter-check-bootstrap  = "check --profile ax-iter -p bbnf-bootstrap"
iter-check-full       = "check --profile ax-iter --workspace"

# Iteration: nextest targets (ax-iter profile). `cargo test` is deliberately
# absent — nextest is the required runner (feedback: build-infra-first).
iter-test             = "nextest run --cargo-profile ax-iter --workspace --features xtask/architecture-test-seams"
iter-test-architecture = "nextest run --cargo-profile ax-iter -p xtask --features xtask/architecture-test-seams --test architecture"
iter-test-core        = "nextest run --cargo-profile ax-iter -p bbnf"
iter-test-ir          = "nextest run --cargo-profile ax-iter -p bbnf-ir"
iter-test-analysis    = "nextest run --cargo-profile ax-iter -p bbnf-analysis"
iter-test-prettify    = "nextest run --cargo-profile ax-iter -p gorgeous"
iter-test-lsp         = "nextest run --cargo-profile ax-iter -p bbnf-lsp"

# Leaf-crate test tier under ax-iter (no derive-Parser sites; fastest
# correctness tier). Crate names match the workspace's actual package
# names; `scripts/test-tier.sh leaf` routes through this alias. B1.md
# hard-gate item 5 references it by name.
iter-test-leaf        = "nextest run --cargo-profile ax-iter -p bbnf-ir -p egraph -p csp-solver -p bbnf-ser"

# Grammar-tier passthrough under ax-iter. Pair with `--test <name>` or
# `-p <crate>` at call sites, e.g.
# `cargo iter-test-grammar -p bbnf --test value_api_apples_to_apples`.
iter-test-grammar     = "nextest run --cargo-profile ax-iter"

# Iteration: clippy (matches iter-check shape).
iter-clippy           = "clippy --profile ax-iter --workspace --all-targets --features xtask/architecture-test-seams -- -D warnings"

# Benches: divan harness (ay-final profile). One cargo invocation per target;
# divan's per-sample regression check runs inside the harness.
bench-all             = "bench --profile ay-final --workspace --features bbnf/competitor,bbnf/stress,bbnf/vm,bbnf/wasm-bench"
bench-json            = "bench --profile ay-final -p bbnf --features competitor,stress,vm --bench json_monolithic --bench json_parse_that --bench json_vm --bench json_competitors --bench json_stress --bench json_value"
bench-css             = "bench --profile ay-final -p bbnf --features competitor,stress,vm --bench css_l4 --bench css_vm --bench css_competitors --bench css_stress"
bench-bbnf            = "bench --profile ay-final -p bbnf --bench bbnf_monolithic"
bench-sheets          = "bench --profile ay-final -p bbnf --features vm --bench google_sheets_monolithic --bench google_sheets_vm"
bench-compile         = "bench --profile ay-final -p bbnf --bench compile_pipeline"

# Bench-iter surface: same harness selection as `bench-*` above, but compiled
# under `[profile.bench-iter]` (no LTO, codegen-units=16, incremental). Use
# during iteration to rebuild bench binaries in seconds rather than minutes;
# final-grade numerics still flow through `bench-*` (ay-final).
bench-iter-all        = "bench --profile bench-iter --workspace --features bbnf/competitor,bbnf/stress,bbnf/vm,bbnf/wasm-bench"
bench-iter-json       = "bench --profile bench-iter -p bbnf --features competitor,stress,vm --bench json_monolithic --bench json_parse_that --bench json_vm --bench json_competitors --bench json_stress --bench json_value"
bench-iter-css        = "bench --profile bench-iter -p bbnf --features competitor,stress,vm --bench css_l4 --bench css_vm --bench css_competitors --bench css_stress"
bench-iter-bbnf       = "bench --profile bench-iter -p bbnf --bench bbnf_monolithic"
bench-iter-sheets     = "bench --profile bench-iter -p bbnf --features vm --bench google_sheets_monolithic --bench google_sheets_vm"
bench-iter-compile    = "bench --profile bench-iter -p bbnf --bench compile_pipeline"

# B0.W1.a three-tier surface — `prep-bench` and `final-bench` anchor
# the profiling-prep and publish-grade tiers. Profile definitions live
# in root Cargo.toml ([profile.profiling-prep] inherits release with
# debug=true, strip=false; [profile.bench] fat-LTO publish). AY W5-W7
# gate commands in PROFILING.md reach these via
# `scripts/prepare-profile-wave.sh` + `scripts/profile-bench-headless.sh`.
prep-bench            = "bench --profile profiling-prep --no-run"
final-bench           = "bench --profile bench"

# Expand entrypoints for AY.W5-W7 hard gates (one per grammar). Callers
# redirect into files under target/expand/ — the make wrappers
# (`make ay-expand-json` etc.) do exactly that.
expand-json           = "expand -p bbnf --bench json_monolithic"
expand-css            = "expand -p bbnf --bench css_l4"
expand-bbnf           = "expand -p bbnf --bench bbnf_monolithic"
expand-sheets         = "expand -p bbnf --bench google_sheets_monolithic"

# `cargo asm-parse --bench <name> <fn>` for AY.W5 close-stamp asm
# inspection. Separate from asm-bbnf (workspace-level) because the
# bench target selection matters for symbol scoping.
asm-parse             = "asm -p bbnf --profile release"

# Expansion / inspection (debug investigations).
expand-bootstrap      = "expand --profile ax-iter -p bbnf-bootstrap --lib"
expand-derive         = "expand --profile ax-iter -p bbnf --lib"
asm-bbnf              = "asm --profile ay-final -p bbnf"

# ── Build flags ─────────────────────────────────────────────────────────────
# 2026-04-25 B1.W4-followup (pre-B2): `-Zthreads=8 -Zshare-generics=y` were
# active in B1.W0.b (`416dcf76`) on the hypothesis that they would reduce
# cold workspace-check wall. Audit α (`docs/audit/2026-04-25-deep-audit/
# AUDIT-A-B1-retrospective.md`) measured a 28× warm regression on
# `cargo iter-check` (0.14 s d7-baseline → 3.88 s post-B1) attributable
# entirely to the build-level rustflags: small-crate warm checks pay
# rustflags-fixed setup cost without amortising the benefit.
#
# `-Zshare-generics`'s benefit is strictly cold + cross-crate-generic;
# warm `iter-check` is neither. `-Zthreads` adds parallel-front-end
# overhead that dominates small-crate-set warm builds. Both removed.
#
# Cold-build re-evaluation: the gorgeous fix (B1.W0 trium) + the
# B2 architectural transposition (proc-macro retirement) move the
# cold-wall conversation into a different regime; if a future tranche
# wants to revisit `-Zthreads` / `-Zshare-generics` it does so with a
# warm-vs-cold tradeoff measured against the post-B2 baseline, not
# this B1-era assumption.

# ── Target-specific overrides ───────────────────────────────────────────────

# Dev-only codegen backend: cranelift. Applied via per-profile override so
# release/bench stay on LLVM (required for "beat lightningcss" measurement).
# Enabled by the rust-toolchain.toml component `rustc-codegen-cranelift`.
# Uncomment once the nightly pin verification lands; leave commented if
# cranelift is broken on the pinned nightly (measure before enabling).
#
# [profile.ax-iter]
# codegen-backend = "cranelift"
