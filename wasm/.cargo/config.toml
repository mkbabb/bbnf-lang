# WASM default stack is 1MB — the BBNF grammar parser uses recursive descent
# which overflows on complex regex patterns + gorgeous formatting pipelines.
# 8MB provides sufficient headroom for deeply nested inputs.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=8388608", "-C", "target-feature=+simd128"]
