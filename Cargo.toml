[workspace]
members = ["crates/core", "crates/derive", "crates/analysis", "crates/ir", "crates/lsp", "crates/ser", "crates/gorgeous", "crates/bootstrap", "crates/egraph", "crates/egraph-derive", "crates/csp-solver", "crates/bbnf-tape", "crates/bbnf-simd-scan", "crates/bbnf-json-prototype"]
exclude = ["wasm"]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1
debug = true
strip = false
split-debuginfo = "packed"

[profile.bench]
# AW-IV.W2.2 — belt-and-suspenders verification cover for W2.1's
# inline-emit migration. The hot-path strategy is source-level flat
# emission (helper bodies spliced into walker arms at codegen); LTO +
# codegen-units=1 catch any helper that slipped through and remained as
# a cross-crate call boundary, collapsing it at link time so `nm` shows
# zero hot-path helper symbols in the bench binary. `debug = true`
# preserved for samply symbol resolution (see feedback_samply_symbols).
lto = "fat"
codegen-units = 1
debug = true

[profile.dev]
incremental = true
codegen-units = 16

[profile.dev.package.bbnf-ir]
opt-level = 1

[profile.dev.package.csp-solver]
opt-level = 1

[profile.dev.package.parse_that]
opt-level = 1

# Lean iteration profile for compile-gate + non-samply test runs.
#
# The `dev` profile carries `debuginfo=2` because samply needs DWARF
# for symbol resolution (see feedback_samply_symbols). That same DWARF
# cost drove AX.W0a.2.d's 26 GB-RSS single-rustc OOM (tape_parity
# aggregate before the per-grammar split). When an agent only needs
# "does it compile?" / "do these tests pass?" — not a profile — the
# DWARF budget is dead weight.
#
# Usage:
#   cargo test --profile ax-iter -p bbnf --test tape_parity_json
#   cargo check --profile ax-iter -p bbnf
#
# Inherits from `dev` (incremental on, per-package opt-level=1 above),
# then strips debuginfo. Link time ≈ 2×; peak RSS ≈ 0.3× on aggregate
# test binaries. Never use for samply or crash-dump workflows.
[profile.ax-iter]
inherits = "dev"
debug = 0
split-debuginfo = "off"
strip = "debuginfo"
