[package]
name = "bbnf-ir"
version = "0.1.6"
edition = "2024"
license = "MIT"
description = "Canonical Grammar IR for the BBNF compiler pipeline"
repository = "https://github.com/mkbabb/bbnf-lang"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rmp-serde = "1"
parse_that = "0.4"
rustc-hash = "2"
rayon = "1"
csp-solver = "0.1"

[dev-dependencies]
regex = "1"
