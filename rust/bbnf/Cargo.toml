[package]
name = "bbnf"
version = "0.2.6"
edition = "2024"
license = "MIT"
description = "BBNF grammar parser and code generator built on parse_that"
repository = "https://github.com/mkbabb/bbnf-lang"

[lib]
name = "bbnf"
path = "src/lib.rs"

[dependencies]
pprint = "0.3"
parse_that = "0.3"
bbnf-ir = { version = "0.1", path = "../bbnf-ir" }

regex = { version = "1.11", features = ["perf"] }

syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
indexmap = "2"

[dev-dependencies]
tempfile = "3"
gorgeous = { version = "0.1", features = ["vm"] }
bencher = "0.1"

[[bench]]
name = "google_sheets"
harness = false
