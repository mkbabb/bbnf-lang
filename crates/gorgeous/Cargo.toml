[package]
name = "gorgeous"
version = "0.1.10"
edition = "2024"
license = "MIT"
description = "Grammar-driven pretty printers auto-generated from BBNF grammars"
repository = "https://github.com/mkbabb/gorgeous"

[[bin]]
name = "gorg"
path = "src/main.rs"

[lib]
name = "gorgeous"
path = "src/lib.rs"

[features]
# Default builds ONLY the feature-independent surface (PrinterConfig,
# the builtin/jit glue, and the vm module when `vm` is enabled). Every
# grammar derive site is opt-in so a downstream consumer pays only for
# the grammars it imports.
default = ["bbnf-grammar", "json-grammar", "css-grammar", "ebnf-grammar", "bnf-grammar", "sheets-grammar"]
# Per-grammar gates — each turns on exactly ONE `#[derive(Parser)]`
# invocation inside gorgeous's lib (see Change 2 for the module
# `#[cfg(feature = …)]` splice). `bin-full` is the aggregate feature
# the `gorg` binary needs; it re-enables every grammar.
bbnf-grammar = []
json-grammar = []
css-grammar = []
ebnf-grammar = []
bnf-grammar = []
sheets-grammar = []
bin-full = ["bbnf-grammar", "json-grammar", "css-grammar", "ebnf-grammar", "bnf-grammar", "sheets-grammar"]
vm = ["dep:bbnf-ir"]

[dependencies]
parse_that = { version = "0.4", features = ["diagnostics"] }
bbnf_derive = { version = "0.2", path = "../derive" }
bbnf = { version = "0.2", path = "../core" }
bbnf-ir = { version = "0.1", path = "../ir", optional = true }
pprint = "0.3"

[dev-dependencies]
# The crates.io biome_css_* 0.5.7/0.5.8 publishes have a version skew
# (biome_rowan 0.5.8 added a SyntaxKind::is_trivia method that
# biome_json_syntax 0.5.7 never implemented), making them uncompilable
# on modern nightly. Pin both to a known-good tag from the upstream
# monorepo instead.
biome_css_parser = { git = "https://github.com/biomejs/biome", tag = "cli/v1.9.4" }
biome_css_formatter = { git = "https://github.com/biomejs/biome", tag = "cli/v1.9.4" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1"
