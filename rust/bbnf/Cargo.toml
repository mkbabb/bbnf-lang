[package]
name = "bbnf"
version = "0.2.11"
edition = "2024"
license = "MIT"
description = "BBNF grammar parser and code generator built on parse_that"
repository = "https://github.com/mkbabb/bbnf-lang"

[lib]
name = "bbnf"
path = "src/lib.rs"

[dependencies]
pprint = "0.3"
parse_that = "0.3"
bbnf-ir = { version = "0.1", path = "../bbnf-ir" }

regex = { version = "1.11", features = ["perf"] }

syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
indexmap = "2"

[dev-dependencies]
tempfile = "3"
bbnf_derive = { version = "0.2", path = "../bbnf-derive" }
pprint = "0.3"
bencher = "0.1"
mimalloc = "0.1"

# JSON competitor parsers
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.3"
simd-json = "0.14"
jiter = "0.8"

[[bench]]
name = "google_sheets"
harness = false

[[bench]]
name = "json_parse"
harness = false

[[bench]]
name = "css_parse"
harness = false

[[bench]]
name = "json_competitors"
harness = false
