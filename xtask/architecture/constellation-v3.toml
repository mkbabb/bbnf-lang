schema = "bbnf.architecture.constellation.v3.1"

[[repositories]]
id = "bbnf"
discovery = "workspace_root"

[[repositories]]
id = "parse-that"
discovery = "sibling"
sibling_name = "parse-that"

[[repositories]]
id = "pprint"
discovery = "sibling"
sibling_name = "pprint"

[[products]]
id = "bbnf-language"
repository = "bbnf"
workspaces = ["bbnf-root", "bbnf-skinny", "bbnf-wasm"]
package_faces = ["bbnf-root-rust", "bbnf-skinny-rust", "bbnf-wasm-rust", "bbnf-root-frontend", "bbnf-extension", "bbnf-playground", "bbnf-wasm-browser", "bbnf-wasm-node", "bbnf-wasm-node-debug"]

[[products]]
id = "parse-that-language"
repository = "parse-that"
workspaces = ["parse-that-rust"]
package_faces = ["parse-that-rust-face", "parse-that-typescript"]

[[workspaces]]
id = "bbnf-root"
repository = "bbnf"
manifest = "Cargo.toml"
package_faces = ["bbnf-root-rust", "bbnf-root-frontend", "bbnf-extension", "bbnf-playground"]

[[workspaces]]
id = "bbnf-skinny"
repository = "bbnf"
manifest = "skinny/Cargo.toml"
package_faces = ["bbnf-skinny-rust"]

[[workspaces]]
id = "bbnf-wasm"
repository = "bbnf"
manifest = "wasm/Cargo.toml"
package_faces = ["bbnf-wasm-rust", "bbnf-wasm-browser", "bbnf-wasm-node", "bbnf-wasm-node-debug"]

[[workspaces]]
id = "parse-that-rust"
repository = "parse-that"
manifest = "rust/Cargo.toml"
package_faces = ["parse-that-rust-face", "parse-that-typescript"]

[[contexts]]
id = "cargo-bbnf-root"
kind = "cargo"
repository = "bbnf"
workspace = "bbnf-root"
package_faces = ["bbnf-root-rust"]
manifest = "Cargo.toml"
lock = "Cargo.lock"
config_inputs = []
target = "host"
profile = "dev"

[[contexts]]
id = "cargo-bbnf-skinny"
kind = "cargo"
repository = "bbnf"
workspace = "bbnf-skinny"
package_faces = ["bbnf-skinny-rust"]
manifest = "skinny/Cargo.toml"
lock = "skinny/Cargo.lock"
config_inputs = []
target = "host"
profile = "dev"

[[contexts]]
id = "cargo-bbnf-wasm"
kind = "cargo"
repository = "bbnf"
workspace = "bbnf-wasm"
package_faces = ["bbnf-wasm-rust"]
manifest = "wasm/Cargo.toml"
lock = "wasm/Cargo.lock"
config_inputs = []
target = "wasm32-unknown-unknown"
profile = "release"

[[contexts]]
id = "cargo-parse-that-rust"
kind = "cargo"
repository = "parse-that"
workspace = "parse-that-rust"
package_faces = ["parse-that-rust-face"]
manifest = "rust/Cargo.toml"
lock = "rust/Cargo.lock"
config_inputs = []
target = "host"
profile = "dev"

[[contexts]]
id = "frontend-bbnf-root"
kind = "frontend"
repository = "bbnf"
workspace = "bbnf-root"
package_faces = ["bbnf-root-frontend", "bbnf-extension", "bbnf-playground"]
manifest = "package.json"
lock = "package-lock.json"
config_inputs = ["extension/package.json", "extension/tsconfig.json", "playground/package.json", "playground/playwright.config.ts", "playground/tsconfig.json", "playground/tsconfig.node.json", "playground/vite.config.ts"]
target = "browser-node"
profile = "production-test"

[[contexts]]
id = "frontend-parse-that-typescript"
kind = "frontend"
repository = "parse-that"
workspace = "parse-that-rust"
package_faces = ["parse-that-typescript"]
manifest = "typescript/package.json"
lock = "typescript/package-lock.json"
config_inputs = ["typescript/tsconfig.json", "typescript/vite.config.ts"]
target = "browser-node"
profile = "production-test"

[[package_faces]]
id = "bbnf-root-rust"
repository = "bbnf"
product = "bbnf-language"
workspace = "bbnf-root"
kind = "rust"
root = "."
manifest = "Cargo.toml"

[[package_faces]]
id = "bbnf-skinny-rust"
repository = "bbnf"
