name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    name: Rust — cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-expand
        run: cargo install cargo-expand --locked
      - name: Bootstrap regen clean
        run: bash scripts/check-bootstrap-clean.sh
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Sonic-rs JSON parity
        run: cargo test -p bbnf --test sonic_rs_parity --release
      - name: Lightningcss CSS parity
        run: cargo test -p bbnf --test lightningcss_parity --release

  extension:
    name: Extension — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
