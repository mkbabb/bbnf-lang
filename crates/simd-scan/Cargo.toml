[package]
name = "simd-scan"
version = "0.1.0"
edition = "2024"
description = "Architecture-neutral SIMD structural-bitmap kernel for the bbnf-lang DTA driver. Builds a StructuralIndex (positions + kinds) once per parse via per-arch (NEON / AVX2 / AVX-512 / WASM SIMD / portable scalar) kernels selected by runtime feature detection."

[lib]
crate-type = ["lib"]

[dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"

[dev-dependencies]
bbnf-corpus = { path = "../corpus" }
proptest = "1"
divan = "0.1"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "stage1_throughput"
harness = false
