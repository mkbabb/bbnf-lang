[package]
name = "bbnf-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "WASM bindings for BBNF analysis + gorgeous formatting"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bbnf-analysis = { version = "0.1.2", path = "../crates/analysis" }
bbnf = { version = "0.2.12", path = "../crates/core" }
bbnf-ir = { version = "0.1.7", path = "../crates/ir" }
gorgeous = { version = "0.1", path = "../crates/gorgeous", features = ["vm", "bbnf-grammar", "bnf-grammar", "css-grammar", "ebnf-grammar", "json-grammar"] }
# The sibling repositories, as git + rev edges with their crates.io versions
# (the root workspace's [workspace.dependencies] pins, sk-v27 LW2.TOPO-1).
pprint = { version = "0.3.7", git = "https://github.com/mkbabb/pprint", rev = "9322105b34bda70828d71b359c12992e78562375" }
parse_that = { version = "0.4", git = "https://github.com/mkbabb/parse-that", rev = "d5f0a5c3d8dc046e57450ad34956f4359b4e6029" }
ls-types = "0.0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
# Requires binaryen >= 119 installed (brew install binaryen).
wasm-opt = ["-O3", "--enable-simd"]

[profile.release]
opt-level = 3
lto = true

