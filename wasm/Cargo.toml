[package]
name = "bbnf-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "WASM bindings for BBNF analysis + gorgeous formatting"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bbnf-analysis = { version = "0.1", path = "../rust/analysis" }
bbnf = { version = "0.2", path = "../rust/core" }
bbnf-ir = { version = "0.1", path = "../rust/ir" }
gorgeous = { version = "0.1", features = ["vm"] }
pprint = "0.3"
parse_that = "0.4"
ls-types = "0.0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
# Requires binaryen >= 119 installed (brew install binaryen).
wasm-opt = ["-O3", "--enable-simd"]

[profile.release]
opt-level = 3
lto = true

