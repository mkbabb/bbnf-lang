name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# sk-v27 LW2.TOPO-3: the arm set is macos-15 (for the order's macos-14) and ubuntu-latest on the pinned
# stable toolchain (rust-toolchain.toml), each sharded three ways with the
# preflight (regen, clippy -D warnings, iter-check) on both arms; a
# `cargo +stable` job on the latest stable; and an Intel SDE job that runs
# the generated parsers' x86 paths (the kernels and their SDE arm are
# parse-that-simd's, in parse-that, since LW2.PERF-1). `ci-ok` needs every job and is the one required
# check. The build wrapper is set here (RUSTC_WRAPPER with the sccache
# action), never in .cargo/config.toml (LW2.TOPO-2).

jobs:
  rust:
    name: Rust (${{ matrix.os }}) — preflight + workspace close (shard ${{ matrix.partition }}/${{ matrix.total }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    # ── Nextest partitioning (AZ-III.W0p.5) ────────────────────────────
    # The workspace test step runs as a 3-shard matrix via
    # `cargo nextest --partition count:N/M`; nextest deterministically
    # bins each test binary into one of the three shards by hashing,
    # so each runner exercises ~1/3 of the workspace test surface in
    # parallel. Preflight and parity steps gate to partition 1 only
    # (`if: matrix.partition == 1`) — they are single-instance gates
    # that derive no benefit from sharding (preflight is fast; parity
    # suites are focused single-binary invocations). Junit artifacts
    # upload per-shard so all three shards' results are preserved.
    strategy:
      fail-fast: false
      matrix:
        # macos-15 (Apple silicon, NEON): GitHub no longer serves macos-14
        # ("The configuration 'macos-14-arm64-us-default' is not supported",
        # pprint run 42732073134); the order's macos-14 arm reads here.
        os: [macos-15, ubuntu-latest]
        partition: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@v4
      # The pin (stable 1.99.1) lives in rust-toolchain.toml; the explicit
      # install makes rustup fetch it before the first cargo call.
      - name: toolchain (the rust-toolchain.toml pin, stable)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      # RUSTC_WRAPPER (job env) names sccache, backed by the Actions cache.
      - name: install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: install cargo-expand
        if: matrix.partition == 1
        run: cargo install cargo-expand --locked

      # ── Preflight (routine surface) ────────────────────────────────
      # Fast checks on the ax-iter profile: regen drift gate (xtask
      # regenerates per-grammar `crates/core/src/grammar/generated/` to
      # a tempdir + diffs against checked-in; non-zero exit blocks PR),
      # clippy, and compile-gate via the iter-check alias (excludes the
      # heavy link-time crates per B1.md invariant 10). Short timeout —
      # this block is the iteration loop, not the close gate. Pinned to
      # partition 1 so the preflight gate runs once per workflow.
      - name: preflight — regen check (xtask)
        if: matrix.partition == 1
        timeout-minutes: 5
        run: cargo xtask regen --check
      - name: preflight — clippy (ax-iter)
        if: matrix.partition == 1
        timeout-minutes: 10
        run: cargo iter-clippy
      - name: preflight — iter-check (ax-iter compile-gate)
        if: matrix.partition == 1
        timeout-minutes: 5
        run: cargo iter-check

      # ── Heavy (wave-close gates) ───────────────────────────────────
      # Full-workspace correctness via nextest under the ci profile
      # (retries=1, fail-fast=false, junit output). Sharded into 3
      # partitions (count:N/3) for parallel CI wall-time reclaim.
      # Parity suites run under the release profile; they are pinned
      # to partition 1 because they are focused single-test invocations
      # that don't benefit from partitioning. These are the close
      # gates; they pay the full release cost and are explicitly
      # separated from the preflight block above.
      # sk-v27 LW2.TOPO-6 (ruling R-c): the test corpus is the release asset
      # named in corpus/MANIFEST.sha256, fetched over public HTTPS with no
      # token and checked file by file before any test reads it.
      - name: corpus — fetch and verify (release asset, sha256 manifest)
        run: cargo xtask corpus fetch
      - name: heavy — workspace tests (nextest, ci profile, shard ${{ matrix.partition }}/${{ matrix.total }})
        run: cargo nextest run --workspace --profile ci --partition count:${{ matrix.partition }}/${{ matrix.total }}
      - name: heavy — sonic-rs JSON parity
        if: matrix.partition == 1
        run: cargo nextest run -p bbnf --test sonic_rs_parity --profile ci --cargo-profile release
      - name: heavy — lightningcss CSS parity
        if: matrix.partition == 1
        run: cargo nextest run -p bbnf --test lightningcss_parity --profile ci --cargo-profile release
      - name: upload nextest junit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.os }}-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  hermetic:
    # CB-1a: a fresh checkout, with no sibling repositories and no
    # credentials, builds the whole workspace from its pinned git edges.
    # The script also fails on any path package outside the repository
    # and on any git package not pinned by rev.
    name: Rust — hermetic clean-clone build
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: toolchain (the rust-toolchain.toml pin, stable)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - name: install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      # sk-v27 LW2.TOPO-1 (X-5): the three-repository crate graph is the DAG
      # pprint <- parse-that <- bbnf-lang, read from cargo's own resolution.
      - name: repo DAG (pprint <- parse-that <- bbnf-lang)
        run: sh scripts/check-repo-dag.sh
      - name: hermetic build
        run: sh scripts/check-hermetic-build.sh

  stable:
    # The LW1.PERF-2 command on the latest stable release: the forward arm of
    # the pin, so a new stable that breaks the build is read before the pin
    # moves.
    name: Rust — cargo +stable (latest)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo +stable --version
      - run: cargo +stable build --release --locked
      - run: cargo +stable xtask corpus fetch
      - run: cargo +stable test --workspace --locked --no-fail-fast

  sde:
    # Intel SDE (Sapphire Rapids: AVX-512 F, BW, VBMI2) runs the generated
    # JSON and CSS parsers compiled for that CPU, so the x86 SIMD paths
    # the emitter still writes (until codegen routes to the kernels, U6)
    # and parse_that::scan's AVX-512 tier execute on an emulated part that
    # has the ISA (ruling X-4). parse-that-simd's own SDE arm is in
    # parse-that. `--target` keeps RUSTFLAGS off build scripts and proc
    # macros, which run natively on the runner.
    name: Rust — Intel SDE (AVX-512, generated parsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (the rust-toolchain.toml pin, stable)
        run: |
          rustup toolchain install
          rustc --version
      - uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
      # The parity suites read the canonical corpus (TOPO-6).
      - name: corpus — fetch and verify (release asset, sha256 manifest)
        run: cargo xtask corpus fetch
      - name: generated-parser parity suites under SDE
        run: |
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$SDE_PATH/sde64 -spr --"
          RUSTFLAGS="-C target-cpu=sapphirerapids" cargo test --target x86_64-unknown-linux-gnu -p bbnf --locked --no-fail-fast --test json_parity --test css_l4_parity

  extension:
    name: Extension — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  typescript:
    # sk-v27 LW2 (S14 on S13-G4): the TypeScript suite, parity.test.ts
    # included, gates the merge like every Rust arm. R-b's "no divergence is
    # closed by deleting its test" and LG-b need it read in CI, not locally.
    # The parity test's Rust arm is bbnf-bootstrap's debug_parse binary.
    name: TypeScript — tests (with the Rust parity arm)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (the rust-toolchain.toml pin, stable)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - name: install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: build the parity test's Rust arm
        run: cargo build -p bbnf-bootstrap --bin debug_parse --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: typescript
      - run: npm test
        working-directory: typescript

  ci-ok:
    # The one required check: every arm above, by name.
    name: ci-ok
    if: always()
    needs: [rust, stable, sde, hermetic, extension, typescript]
    runs-on: ubuntu-latest
    steps:
      - name: every arm succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
