[package]
name = "bbnf"
version = "0.2.11"
edition = "2024"
license = "MIT"
description = "BBNF grammar parser and code generator built on parse_that"
repository = "https://github.com/mkbabb/bbnf-lang"

[lib]
name = "bbnf"
path = "src/lib.rs"

[dependencies]
pprint = "0.3"
parse_that = "0.4"
bbnf-ir = { version = "0.1", path = "../bbnf-ir" }

syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
indexmap = "2"
regex-syntax = "0.8.10"
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]

[dev-dependencies]
tempfile = "3"
bbnf_derive = { version = "0.2", path = "../bbnf-derive" }
pprint = "0.3"
parse_that = "0.4"
bencher = "0.1"
mimalloc = "0.1"

# JSON competitor parsers
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.3"
simd-json = "0.14"
jiter = "0.8"
serde_json_borrow = "0.9"
nom = "7"
winnow = "0.7"
pest = "2.5"
pest_grammars = "2.5"

# Tree-sitter
tree-sitter = "0.25"
tree-sitter-json = "0.24"

# CSS competitor parsers
cssparser = "0.34"
lightningcss = "1.0.0-alpha.70"

# Number parsing for borrow/owned tiers
fast-float2 = "0.2"

# Formatting engine (VM-based pretty-printing)
gorgeous = { version = "0.1", features = ["vm"] }

[[bench]]
name = "json_monolithic"
path = "benches/json/monolithic.rs"
harness = false

[[bench]]
name = "json_parse_that"
path = "benches/json/parse_that.rs"
harness = false

[[bench]]
name = "json_vm"
path = "benches/json/vm.rs"
harness = false

[[bench]]
name = "json_competitors"
path = "benches/json/competitors.rs"
harness = false

[[bench]]
name = "json_stress"
path = "benches/json/stress.rs"
harness = false

[[bench]]
name = "css_monolithic"
path = "benches/css/monolithic.rs"
harness = false

[[bench]]
name = "css_l4"
path = "benches/css/l4.rs"
harness = false

[[bench]]
name = "css_vm"
path = "benches/css/vm.rs"
harness = false

[[bench]]
name = "css_competitors"
path = "benches/css/competitors.rs"
harness = false

[[bench]]
name = "css_stress"
path = "benches/css/stress.rs"
harness = false

[[bench]]
name = "google_sheets_monolithic"
path = "benches/google_sheets/monolithic.rs"
harness = false

[[bench]]
name = "google_sheets_vm"
path = "benches/google_sheets/vm.rs"
harness = false
